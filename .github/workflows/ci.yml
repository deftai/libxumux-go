name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make test/coverage
  # ws is a nested module (its own go.mod), which the root `go test ./...`
  # does not reach. Test it against the core version it requires, and
  # against this checkout's core through a workspace, so core changes that
  # break it show up here.
  ws:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ws/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: test against this checkout's core module
        run: |
          go work init . ..
          go test -race -count=1 ./...
  webrtc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webrtc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: webrtc/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build libxumux
        run: |
          git clone --depth 1 --branch main https://github.com/deftai/libxumux ../libxumux
          cd ../libxumux && npm ci && npm run build
      - run: make test/interop LIBXUMUX_DIR=../libxumux
  # The behavioural conformance suite lives in the spec repository.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deftai/xumux
          # The 0.3 draft this library implements.
          ref: v0.3.0-draft
          path: xumux-spec
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: make test/conformance XUMUX_DIR=xumux-spec
